<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
<link rel="stylesheet" href="poly-movies.css">
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="header-shimmer"></div>
  <div class="header-inner">
    <div class="brand" onclick="resetAll()">
      <i class="ph ph-film-strip" style="color:var(--accent)"></i>
      POLY-Media
      <span class="brand-tag">v2</span>
    </div>

    <div class="search-wrap">
      <i class="ph ph-magnifying-glass"></i>
      <input type="text" id="searchBar" placeholder="Search movies, shows, anime…" oninput="onSearch()">
    </div>

    <div class="dd-wrap" id="ddWrap">
      <button class="dd-btn" id="ddBtn">
        <div class="dd-dot" id="ddDot"></div>
        <span id="ddLabel">Movies &amp; TV</span>
        <i class="ph ph-caret-down dd-caret"></i>
      </button>
      <div class="dd-menu hidden" id="ddMenu">
        <div class="dd-section">Mode</div>
        <button class="dd-opt active" data-tab="movies" data-val="all"><i class="ph ph-film-strip"></i> Movies &amp; TV — All</button>
        <button class="dd-opt" data-tab="movies" data-val="movie"><i class="ph ph-film-clapperboard"></i> Movies Only</button>
        <button class="dd-opt" data-tab="movies" data-val="tv"><i class="ph ph-television"></i> TV Shows Only</button>
        <div class="dd-divider"></div>
        <div class="dd-section">Anime</div>
        <button class="dd-opt anime-opt" data-tab="anime" data-val="all"><i class="ph ph-sparkle"></i> All Anime</button>
        <button class="dd-opt anime-opt" data-tab="anime" data-val="tv"><i class="ph ph-monitor-play"></i> Anime Series</button>
        <button class="dd-opt anime-opt" data-tab="anime" data-val="movie"><i class="ph ph-film-slate"></i> Anime Movies</button>
      </div>
    </div>
  </div>
</header>

<!-- ── MAIN ── -->
<main>
  <!-- Trending -->
  <div class="section-header">
    <h2 class="section-title"><i class="ph ph-trend-up"></i> <span id="sectionTitle">Trending Now</span></h2>
    <div class="page-badge">Page <span id="pageNum">1</span></div>
  </div>
  <div class="trending-row" id="trendingRow"></div>

  <!-- Filter tabs -->
  <div class="filter-wrap">
    <div class="tab-bar" id="tabBar"></div>
    <div class="genre-bar" id="genreBar"></div>
  </div>

  <!-- Grid -->
  <div id="mediaGrid"></div>

  <!-- Pagination -->
  <div class="pagination">
    <button class="page-btn" id="prevBtn" disabled><i class="ph ph-caret-left"></i> Prev</button>
    <button class="page-btn" id="nextBtn">Next <i class="ph ph-caret-right"></i></button>
  </div>
</main>

<!-- ── PLAYER MODAL ── -->
<div id="playerModal">
  <div class="modal-container">
    <div class="modal-main">
      <div class="video-wrap">
        <div class="video-controls-bar">
          <div class="subdub-wrap hidden" id="subdubWrap">
            <button class="subdub-btn active" id="subBtn" onclick="setSubDub('sub')">SUB</button>
            <button class="subdub-btn" id="dubBtn" onclick="setSubDub('dub')">DUB</button>
          </div>
          <div class="src-wrap" id="srcWrap">
            <button class="src-btn" id="srcBtn">
              <span class="src-dot"></span>
              <span id="srcLabel">VidLink</span>
              <i class="ph ph-caret-down src-caret"></i>
            </button>
            <div class="src-menu hidden" id="srcMenu"></div>
          </div>
          <div class="vid-spacer"></div>
          <button class="vid-ctrl-btn" title="Reload" onclick="reloadStream()"><i class="ph ph-arrow-clockwise"></i></button>
          <button class="vid-ctrl-btn close" title="Close" onclick="closePlayer()"><i class="ph ph-x"></i></button>
        </div>
        <div class="loader-overlay" id="loaderOverlay">
          <i class="ph ph-circle-notch spin"></i>
          <span id="loaderText">Loading stream…</span>
        </div>
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
      </div>

      <div class="modal-info">
        <div class="info-card">
          <div class="info-poster"><img id="infoPosterImg" src="" alt=""></div>
          <div class="info-right">
            <h3 class="modal-title" id="modalTitle">—</h3>
            <div class="meta-pills" id="modalMeta"></div>
            <div class="overview-lbl">Synopsis</div>
            <p class="modal-overview" id="modalOverview"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="tv-sidebar hidden" id="tvSidebar">
      <div class="sidebar-hdr">
        <span class="sidebar-lbl" id="sidebarLbl">Episodes</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="anime-eps-badge hidden" id="epsBadge"></span>
          <div class="season-dd" id="seasonDdWrap">
            <select id="seasonSelect"></select>
          </div>
        </div>
      </div>
      <div id="episodeList"><div class="ep-loader"><i class="ph ph-circle-notch spin"></i><span>Loading…</span></div></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"><i class="ph ph-check-circle" style="color:var(--accent);font-size:15px;"></i><span id="toastMsg">Done</span></div>

<script src="poly-movies.js"></script>
</body>
</html>
