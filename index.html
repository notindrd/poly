<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="math/shared.css">
    <style>
        .menu-transition {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
    </style>
</head>
<body class="launcher-body">

    <!-- The main Iframe taking up the entire screen -->
    <iframe 
        id="main-iframe" 
        srcdoc="<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'><link rel='stylesheet' href='math/shared.css'></head><body class='launcher-welcome'><div class='launcher-welcome-card'><h1>POLY</h1><p>Choose a destination from the launcher to get started.</p><p class='launcher-welcome-meta'>Ready when you are</p></div></body></html>"
        class="launcher-frame"
        title="Main Content View"
        allowfullscreen>
    </iframe>

    <!-- Floating launcher menu toggle -->
    <button 
        id="menu-toggle" 
        onclick="toggleMenu()"
        class="launcher-toggle"
        title="Toggle Shortcuts">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <span>Menu</span>
    </button>

    <!-- Floating control panel -->
    <div 
        id="control-panel" 
        class="launcher-panel menu-transition">
        
        <h2 class="launcher-heading">
            <svg xmlns="http://www.w3.org/2000/svg" class="launcher-heading-mark" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            Shortcuts
            <button onclick="toggleMenu()" class="launcher-close" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </h2>
        
        <!-- Games Section -->
        <div class="launcher-section">
            <p class="launcher-label">&gt;&gt; Games</p>
            <button onclick="loadSource('https://cdn.jsdelivr.net/gh/notindrd/poly@main/loadable-svg/gn-math.svg')" class="launcher-button">
                <span>[01] Gn-math</span>
                <span class="launcher-button-arrow">-&gt;</span>
            </button>
            <button onclick="loadSource('https://cdn.jsdelivr.net/gh/notindrd/poly@main/loadable-svg/luminsdk.svg')" class="launcher-button">
                <span>[02] Lumin</span>
                <span class="launcher-button-arrow">-&gt;</span>
            </button>
            <button onclick="loadSource('https://cdn.jsdelivr.net/gh/notindrd/poly@main/loadable-svg/ugs.svg')" class="launcher-button">
                <span>[03] UGS</span>
                <span class="launcher-button-arrow">-&gt;</span>
            </button>
        </div>

        <!-- Other Stuff Section -->
        <div class="launcher-section">
            <p class="launcher-label">&gt;&gt; Other_Stuff</p>
            <div class="launcher-empty">
                [ DIRECTORY EMPTY ]
            </div>
        </div>

        <!-- Custom URL Input -->
        <div class="launcher-section">
            <p class="launcher-label">&gt;&gt; Manual Override</p>
            <div class="launcher-input-row">
                <input 
                    type="text" 
                    id="custom-url" 
                    placeholder="ENTER URL..." 
                    class="launcher-input"
                    onkeypress="handleKeyPress(event)">
                <button 
                    onclick="loadCustomSource()" 
                    class="launcher-exec">
                    EXEC
                </button>
            </div>
        </div>

        <!-- Disclaimer -->
        <div class="launcher-warning">
            <p>
                <strong>SYS_WARN:</strong> Some external domains refuse iframe connections. Connection resets may occur.
            </p>
        </div>
    </div>

    <script>
        let isMenuOpen = true;
        const panel = document.getElementById('control-panel');
        const iframe = document.getElementById('main-iframe');
        const customUrlInput = document.getElementById('custom-url');

        // Toggle the visibility of the settings menu
        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                // Show menu
                panel.classList.remove('is-hidden');
            } else {
                // Hide menu
                panel.classList.add('is-hidden');
            }
        }

        // Change the iframe's source URL
        function loadSource(url) {
            // Basic URL formatting check to ensure protocol exists
            let finalUrl = url.trim();
            if (finalUrl !== '' && !finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                finalUrl = 'https://' + finalUrl;
            }
            
            if (finalUrl) {
                // Must remove srcdoc if returning from the default "Welcome" page
                iframe.removeAttribute('srcdoc');
                iframe.src = finalUrl;
                
                // Optional: Automatically close menu on mobile when a link is clicked
                if (window.innerWidth < 768 && isMenuOpen) {
                    toggleMenu();
                }
            }
        }

        // Wrapper for the custom input button
        function loadCustomSource() {
            // Populate the input value into the iframe manually
            loadSource(customUrlInput.value);
        }

        // Allow pressing "Enter" in the input field to trigger the load
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                loadCustomSource();
            }
        }
    </script>
</body>
</html>
